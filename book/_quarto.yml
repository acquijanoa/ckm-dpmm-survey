project:
  type: book
  output-dir: _book

book:
  title: "Survey-Weighted Dirichlet Process Mixture Models"
  subtitle: "Gibbs Sampling, Merging Components into Phenotypes, and Design-Based Inference"
  author: "Aquijano"
  date: today
  chapters:
    - index.qmd

    - part: "Part I: The Survey-Weighted Mixture"
      chapters:
        - 01-dpmm-survey-formulation.qmd
        - 02-gibbs-sampler.qmd
        - 03-components-to-phenotypes.qmd

    - part: "Part II: Design-Based Uncertainty"
      chapters:
        - 04-marginal-score-hessian.qmd
        - 05-stratified-cluster-jackknife.qmd

    - part: "Part III: Simulations and Implementation"
      chapters:
        - 06-simulation-benchmarks.qmd
        - 07-computational-codebook.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: show
    code-copy: true
    code-tools: true
    mathjax: true
  pdf:
    documentclass: scrreprt
    number-sections: true
    toc: true
